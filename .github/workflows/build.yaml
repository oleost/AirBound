# Builds the add-on's images, so Home Assistant downloads a ready image instead of
# compiling Caddy on each user's machine. Runs when the add-on changes on next
# (test builds) or main (released, already-built versions).
#
# Images: ghcr.io/oleost/{amd64,aarch64}-addon-airbound:<version from config.yaml>
name: Build add-on images

on:
  push:
    branches: [next, main]  # next: test builds; main gets only tested commits
    paths: ["airbound/**", ".github/workflows/build.yaml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/unit tests/relay_server

  build:
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version
        id: version
        run: |
          echo "version=$(sed -n 's/^version: "\(.*\)"$/\1/p' airbound/config.yaml)" >> "$GITHUB_OUTPUT"
      - name: A released version keeps its image
        # Images are published under the version number, and Home Assistant installs by that number.
        # Once v<version> is released, only the very same add-on may be built under it again.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git fetch --quiet --depth 1 origin "refs/tags/v$VERSION:refs/tags/v$VERSION" 2>/dev/null; then
            if ! git diff --quiet "v$VERSION" HEAD -- airbound; then
              echo "::error::v$VERSION is released and the add-on has changed since. Bump the version in airbound/config.yaml (and add a changelog entry)."
              exit 1
            fi
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: airbound
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.version.outputs.version }}
          labels: |
            io.hass.name=AirBound
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-airbound:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-airbound:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
