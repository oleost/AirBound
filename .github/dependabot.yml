# Weekly update proposals as pull requests against next (the test branch).
# What Dependabot can't see (frp's commit, Caddy and its modules, CrowdSec,
# Go, Home Assistant) is covered by .github/workflows/maintenance.yaml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: next
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: docker
    directory: /airbound
    target-branch: next
    schedule: { interval: weekly, day: monday }
    ignore:
      # A new Python minor version (3.13 -> 3.15) is a deliberate move once
      # musl wheels for our packages exist; Dependabot proposes patch releases.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: pip
    directory: /airbound
    target-branch: next
    schedule: { interval: weekly, day: monday }
    groups:
      addon-python: { patterns: ["*"] }

  - package-ecosystem: pip
    directory: /relay-server/controller
    target-branch: next
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: pip
    directory: /
    target-branch: next
    schedule: { interval: weekly, day: monday }
    groups:
      dev-tools: { patterns: ["*"] }
