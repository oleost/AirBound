  <rect x="222" y="328" width="68" height="54" rx="11" fill="#fff"/>
  <circle cx="256" cy="352" r="7" fill="#0A5FA3"/>
  <rect x="252.5" y="352" width="7" height="16" rx="3.5" fill="#0A5FA3"/>
</svg>
