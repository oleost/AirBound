<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>AirBound</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A9BF0"/>
      <stop offset="1" stop-color="#0A5FA3"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- signal arcs: reachable from anywhere -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="26">
    <path d="M207 150 A70 70 0 0 1 305 150" opacity="0.95"/>
    <path d="M168 112 A124 124 0 0 1 344 112" opacity="0.6"/>
  </g>
