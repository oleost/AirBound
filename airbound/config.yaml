name: AirBound
version: "0.13.16"
slug: airbound
description: "Early release: secure remote access to Home Assistant, with enforced two-step login"
stage: experimental
url: https://github.com/oleost/AirBound
# Ready-made images from GitHub Actions (.github/workflows/build.yaml), so nothing is compiled on your machine.
image: "ghcr.io/oleost/{arch}-addon-airbound"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-lock-outline
panel_title: AirBound
homeassistant_api: true
services:
  - mqtt:want
hassio_api: true
hassio_role: default
map:
  - homeassistant_config:ro
ports:
  443/tcp: 443
ports_description:
  443/tcp: HTTPS for remote access (forward this port on your router)
# Everything is set up in the AirBound panel, so the Configuration tab stays empty.
options: {}
schema: {}
