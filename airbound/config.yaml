name: AirBound
version: "0.11.6"
slug: airbound
description: "Work in progress, not ready for use: secure remote access to Home Assistant without a subscription"
stage: experimental
url: https://github.com/oleost/HA-AirBound
arch:
  - amd64
  - aarch64
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-lock-outline
panel_title: AirBound
homeassistant_api: true
services:
  - mqtt:want
hassio_api: true
hassio_role: default
map:
  - homeassistant_config:ro
ports:
  443/tcp: 443
ports_description:
  443/tcp: HTTPS for remote access (forward this port on your router)
# Everything is set up in the AirBound panel, so the Configuration tab stays empty.
options: {}
schema: {}
